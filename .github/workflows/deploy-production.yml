name: Deploy Cloudflare Pages Production on Release Tag

on:
  release:
    types: [published]

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release tag to production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Validate release tag format
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^[0-9]{8}\.[0-9]+-prod$ ]]; then
            echo "Invalid release tag: '$TAG'"
            echo "Required format: YYYYMMDD.N-prod (example: 20260222.1-prod)"
            exit 1
          fi

      - name: Validate required GitHub variable
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing Actions variable: CLOUDFLARE_PAGES_PROJECT_NAME"
            echo "Set it in GitHub repo Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}



      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Asset Downloader
        run: node scripts/download-assets.js

      - name: Build Astro Project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Astro builds to the "dist" folder by default, so we deploy "dist" instead of copying files manually
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        env:
          WRANGLER_LOG: debug

      - name: Deployment output
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.deployment-url }}"
          echo "Alias URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
